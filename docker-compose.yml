# App + Postgres. The app listens only on 127.0.0.1:${APP_PORT} so the
# existing host nginx can reverse-proxy the domain to it (see deploy/nginx.conf.example).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-english}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-english}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-english}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-english}
      # First admin account — only used if no admin exists yet (see README)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-}
      FAMILY_NAME: ${FAMILY_NAME:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - etechlo_net

volumes:
  pgdata:
networks:
  etechlo_net:
    external: true
